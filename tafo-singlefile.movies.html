<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TafoFlix</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0000;color:#eee;font-family:'DM Sans',sans-serif;overflow-x:hidden}

#waveCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.1) 3px,rgba(0,0,0,0.1) 4px);
  pointer-events:none;z-index:2;
}

nav{
  position:fixed;top:0;width:100%;z-index:1000;
  padding:0 5%;height:70px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(15,0,0,0.98),transparent);
  border-bottom:1px solid rgba(255,0,0,0.15);
}

.logo{font-family:'Bebas Neue';font-size:28px;letter-spacing:4px;color:#fff;text-decoration:none}
.logo span{color:#e50914; text-shadow: 0 0 15px rgba(229,9,20,0.6)}

.nav-right { display: flex; align-items: center; gap: 15px }

#searchBox{
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(229, 9, 20, 0.4);
  color: #fff; padding: 8px 16px; border-radius: 4px; width: 200px;
  outline: none; transition: 0.3s;
  box-shadow: 0 0 5px rgba(229, 9, 20, 0.1);
}
#searchBox:focus {
  border-color: #e50914;
  box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
  background: rgba(255, 255, 255, 0.07);
}

.requestBtn {
  background: #e50914; color: #fff; border: none; padding: 8px 16px;
  border-radius: 4px; font-weight: 700; font-size: 11px; cursor: pointer;
  text-transform: uppercase; transition: 0.3s;
}
.requestBtn:hover { background: #ff1f1f; transform: translateY(-2px) }

#genreBar{
  position:sticky;top:70px;z-index:900;
  padding:10px 5%;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  background:rgba(10,0,0,0.85);backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,0,0,0.1);
}
.gBtn{
  background:transparent;border:1px solid rgba(255,255,255,0.1);
  color:#888;padding:5px 16px;border-radius:4px;
  font-size:11px;cursor:pointer;transition:.2s;white-space:nowrap;text-transform:uppercase;
}
.gBtn.active{background:#e50914;color:#fff;border-color:transparent;font-weight:700}

#featured{
  position:relative;height:450px;
  display:flex;align-items:flex-end;
  padding:0 5% 40px;overflow:hidden;z-index:10;
}
#featBg{
  position:absolute;inset:0;
  background-size:cover;background-position:center top;
  transition:opacity .9s ease;z-index:-1;
}
#featBg::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(to right,rgba(10,0,0,1) 0%,rgba(10,0,0,0.6) 40%,transparent 85%),
    linear-gradient(to top,rgba(10,0,0,1) 0%,rgba(10,0,0,0.3) 40%,transparent 70%);
}
#featTitle{
    font-family:'Bebas Neue';font-size:60px;margin-bottom:14px;
    color:#fff;text-shadow: 0 0 20px rgba(229, 9, 20, 0.8);
}

.watchBtn{
  background:#e50914;border:none;padding:12px 32px;font-weight:700;
  cursor:pointer;border-radius:2px;color:#fff;letter-spacing:1px;transition: 0.3s;
}
.watchBtn:hover{background:#ff1f1f; transform: scale(1.05)}

.section{padding:30px 5%;z-index:20;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:30px}

.card{ cursor:pointer; position:relative; transition:0.4s; }
.card img{
  width:100%;aspect-ratio:2/3;object-fit:cover;display:block;
  border-radius:4px;border:1px solid rgba(255,255,255,0.05);
  filter: grayscale(0.2); transition: 0.4s;
}
.card:hover img{border-color:#e50914; filter: grayscale(0); box-shadow: 0 0 20px rgba(229,9,20,0.3);}
.cardTitle{ margin-top:12px;font-size:12px;font-weight:700; color:#bbb; text-transform: uppercase; }

/* MODAL SYSTEM */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:2000;
  display:none; align-items: center; justify-content: center;
  opacity: 0; transition: 0.4s ease;
}
.modal-overlay.active{ display:flex; opacity: 1; }

.modal-content {
    width: 90%; height: 85%; background: #000; border: 1px solid #e50914;
    position: relative; transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal-overlay.active .modal-content { transform: scale(1); }

.close-modal {
    position: absolute; top: -45px; right: 0;
    background: #e50914; color: #fff; border: none;
    width: 35px; height: 35px; font-size: 20px; font-weight: bold;
    cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center;
}
.close-modal:hover { background: #ff1f1f }

iframe{width:100%;height:100%;border:none;}

#fallbackBtn {
  position: absolute; top: -45px; left: 0;
  background: rgba(179, 9, 20, 0.8); color: #fff; padding: 8px 15px;
  border-radius: 4px; font-size: 11px; text-decoration: none; border: 1px solid #e50914;
  font-weight: bold; text-transform: uppercase;
}
</style>
</head>
<body>

<canvas id="waveCanvas"></canvas>

<nav>
  <div class="logo">TAFO<span>FLIX</span></div>
  <div class="nav-right">
    <input type="text" id="searchBox" placeholder="SEARCH..." oninput="handleSearch()">
    <button class="requestBtn" onclick="openRequest()">Request Movies</button>
  </div>
</nav>

<div id="genreBar"></div>

<div id="featured">
  <div id="featBg"></div>
  <div id="featContent">
    <h1 id="featTitle"></h1>
    <button class="watchBtn" onclick="playFeatured()">WATCH NOW</button>
  </div>
</div>

<div id="mainContent"></div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-content">
    <a id="fallbackBtn" target="_blank" style="display:none">Open in New Tab</a>
    <button class="close-modal" onclick="closeModal()">×</button>
    <iframe id="modalFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<script>
(function(){
  const c=document.getElementById('waveCanvas'), ctx=c.getContext('2d');
  let W,H,t=0;
  function r(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  r(); window.addEventListener('resize',r);
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0a0000'; ctx.fillRect(0,0,W,H);
    const rg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,W);
    rg.addColorStop(0,'rgba(60,0,0,0.3)'); rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    ctx.beginPath(); ctx.strokeStyle='rgba(229,9,20,0.12)'; ctx.lineWidth=2;
    for(let x=0;x<=W;x+=5){
      const y=H*.7 + Math.sin(x*.002+t*.001)*50;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke(); t+=16; requestAnimationFrame(draw);
  }
  draw();
})();

const movies=[
  {title:"The Super Mario Galaxy Movie",fileId:"1peOVhCOAfeAmXspIQVx2AO8sF3GnD561",thumbUrl:"https://raw.githubusercontent.com/TafoHubOffical/TafoHub-DONTDMCA-MovieCover-222/refs/heads/main/the-super-mario-galaxy-movie-teaser-poster-1080x1600.jpg",genre:"Animation"},
  {title:"Superman",fileId:"1EWEYnOyTNmNYjWpbNLPZZRBWGrSg1l_B",thumbUrl:"https://raw.githubusercontent.com/TafoHubOffical/TafoHub-DONTDMCA-MovieCover-222/refs/heads/main/Superman%202025.jpg",genre:"Action"},
  {title:"Hoppers",fileId:"1ZFVkHevCTy8kTGhD-0fHnz68F_WLV98-",thumbUrl:"https://raw.githubusercontent.com/MISTERCOOL27277/Movie-Covers-86454433488/refs/heads/main/Hoppers.jpg",genre:"Animation"},
  {title:"Bad Boys Ride Or Die",fileId:"1EpaiYzpPTen1OBc1aya_fP6G18lgGcUs",thumbUrl:"https://raw.githubusercontent.com/TafoHubOffical/TafoHub-DONTDMCA-MovieCover-222/refs/heads/main/Bad%20Boys%20Ride%20Or%20Die.jpeg",genre:"Action"},
  {title:"The Legend Of Aang: The Last Airbender",fileId:"1GLkdpNumWIYJ8rw6kUJgf5NiDLsaUDLU",thumbUrl:"https://raw.githubusercontent.com/TafoHubOffical/TafoHub-DONTDMCA-MovieCover-222/refs/heads/main/The%20Legend%20Of%20Aang%3A%20The%20Last%20Airbender.jpg",genre:"Action"},
  {title:"Terrifier 2",fileId:"1_Jjo7rOcCkYt3UryVkV2XvTfrL4QvHTE",thumbUrl:"https://raw.githubusercontent.com/MISTERCOOL27277/Movie-Covers-86454433488/refs/heads/main/Terrifier%202.jpeg",genre:"Horror"},
  {title:"Terrifier",fileId:"1_pQ3kbz_a8l3B7SKfdP9dYQwKax0WHUD",thumbUrl:"https://raw.githubusercontent.com/MISTERCOOL27277/Movie-Covers-86454433488/refs/heads/main/Terrifier.jpg",genre:"Horror"},
  {title:"Spider-Man: No Way Home",fileId:"1mUF4PcT0_ZKofV0KHHdjxgTQdhF2BliQ",thumbUrl:"https://raw.githubusercontent.com/MISTERCOOL27277/Movie-Covers-86454433488/refs/heads/main/Spider%20Man%20No%20Way%20Home.jpg",genre:"Action"},
  {title:"Goat",fileId:"1ejFJmseRX08D8AW4AchpuYzl5rsJK22t",thumbUrl:"https://raw.githubusercontent.com/MISTERCOOL27277/873637373737377/refs/heads/main/Goat%20Movie.jpg",genre:"Action"},
  {title:"Scream 7",fileId:"1OzXqgxaS5f0cgR33PZDIwi4FfIbhFvMc",thumbId:"11iwQ72QHTeB0YQO2N3wH4AcXcae4aFUU",genre:"Horror"},
  {title:"Five Nights At Freddy's 2",fileId:"1BmS75cTOmPFXkwv40WgJnoAaMbeo546v",thumbId:"18ir-YH8ODiU1aHw7yWSK4yvbjHHsDs90",genre:"Horror"},
  {title:"Zootopia 2",fileId:"1GhDREN9in7ZkoRNOXQCTvwsZYjxDjtwl",thumbId:"1hNnO-kw9OjOLmWkPh1C3Husl3sRKJ-YH",genre:"Animation"},
  {title:"Avatar Fire and Ash",fileId:"1uiIBHk5xdpysNXR09iSy6woGUqpFe4uF",thumbId:"1_dvp1zX0YN7KZsGo8sPJJZK2xNLH-kJT",genre:"Sci-Fi"},
  {title:"The SpongeBob Movie",fileId:"1QCfesoM4uweiz1azvvgDAdHwVNU3duzF",thumbId:"1ow4eXnTJm8FZRylwwetjaXfPcX4Tjm2z",genre:"Animation"},
  {title:"A Minecraft Movie",fileId:"1BLKqInNh03tNScTrvtR14r3nFk5bhR7f",thumbId:"1yxNaS2Omfj0UTvsUfLHy6vuS3zVcKdV3",genre:"Animation"},
  {title:"Venom The Last Dance",fileId:"1ZdhRDJac7D5Q9CXHYdPo_uoQU9aM7Mci",thumbId:"1yAkIvhOUL3ykjCzwn6LsEXW_3Ffg1zbj",genre:"Action"},
  {title:"Free Guy",fileId:"1hX1_ZAHWd3RN_rd3-_cbyyxDdbkHRWhX",thumbId:"1safiTQrxrHKEyUNuL8kaxa4D0y3pmmTo",genre:"Comedy"},
  {title:"Demon Slayer",fileId:"1dcai7qLs1IZOcrdQolWdtfsXtXRtnYDM",thumbId:"1M7FcUQG7wzDboYsjxmCII88jXY47MfTA",genre:"Anime"},
  {title:"FNAF 1",fileId:"19kb8uiVb01NA2ZsTq4-KgsLp1Z5MalI1",thumbId:"116AGGj_wc6hUZQIbwU6mbx4gm_BWY-Pd",genre:"Horror"},
  {title:"Ratatouille",fileId:"1-4M0OT7lpvxc4BdoFp9rEcBiV6zXL_Gl",thumbId:"1iKyBbH_g2dXGM9MJmLMZEO2yTNoaRMzh",genre:"Animation"},
  {title:"Coco",fileId:"194M4dGCwh1hTxVM1-_axnLSdt4trnbK2",thumbId:"160bAd_MaRy7uO5ey3Z9mM96z351pX92m",genre:"Animation"}
];

let activeGenre="All",searchTerm="",featIdx=0;

function updateFeat(){
  const bg=document.getElementById('featBg'),m=movies[featIdx];
  const img=m.thumbUrl||`https://drive.google.com/thumbnail?id=${m.thumbId}&sz=w1000`;
  bg.style.backgroundImage=`url('${img}')`;
  document.getElementById('featTitle').textContent=m.title;
  featIdx=(featIdx+1)%8;
}
setInterval(updateFeat,5000);

function buildG(){
  const g=["All",...new Set(movies.map(m=>m.genre))];
  document.getElementById('genreBar').innerHTML=g.map(x=>`<button class="gBtn ${x===activeGenre?'active':''}" onclick="activeGenre='${x}';buildG();render()">${x}</button>`).join('');
}

function render(){
  const filtered=movies.filter(m=>(activeGenre==="All"||m.genre===activeGenre)&&m.title.toLowerCase().includes(searchTerm));
  document.getElementById('mainContent').innerHTML=`<div class="section"><div class="grid">${filtered.map(m=>{
    const img=m.thumbUrl||`https://drive.google.com/thumbnail?id=${m.thumbId}&sz=w400`;
    return `<div class="card" onclick="openMovie('${m.title.replace(/'/g,"\\'")}','${m.fileId}')">
      <img src="${img}" loading="lazy">
      <div class="cardTitle">${m.title}</div>
    </div>`;
  }).join('')}</div></div>`;
}

function openMovie(t,id){
  const overlay=document.getElementById('modalOverlay'), frame=document.getElementById('modalFrame'), fb=document.getElementById('fallbackBtn');
  const url=`https://drive.google.com/file/d/${id}/preview`;
  frame.src=url; fb.href=url; fb.style.display='block';
  overlay.style.display='flex';
  setTimeout(()=>overlay.classList.add('active'), 10);
  document.body.style.overflow='hidden';
}

function openRequest(){
  const overlay=document.getElementById('modalOverlay'), frame=document.getElementById('modalFrame');
  document.getElementById('fallbackBtn').style.display='none';
  frame.src="https://docs.google.com/forms/d/e/1FAIpQLSf7YYs2uVewjNqVj-E0HkYYoRNv6q90nrRc3xD2pgD6GY2JkQ/viewform?embedded=true";
  overlay.style.display='flex';
  setTimeout(()=>overlay.classList.add('active'), 10);
  document.body.style.overflow='hidden';
}

function closeModal(){
  const overlay=document.getElementById('modalOverlay');
  overlay.classList.remove('active');
  setTimeout(()=>{
    overlay.style.display='none';
    document.getElementById('modalFrame').src="";
    document.body.style.overflow='auto';
  }, 400);
}

function playFeatured(){
  const t=document.getElementById('featTitle').textContent, m=movies.find(x=>x.title===t);
  openMovie(m.title,m.fileId);
}

function handleSearch(){searchTerm=document.getElementById('searchBox').value.toLowerCase();render()}

updateFeat(); buildG(); render();
</script>
</body>
</html>
