<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TaFlix</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#e50914;--bg:#050000;--glow:rgba(229,9,20,0.8)}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#eee;font-family:'DM Sans',sans-serif;overflow-x:hidden}

/* NAVIGATION */
nav{position:fixed;top:0;width:100%;z-index:4000;padding:0 5%;height:70px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.9);backdrop-filter:blur(15px)}
.logo{font-family:'Bebas Neue';font-size:32px;letter-spacing:2px;color:#fff}
.logo span{color:var(--accent);text-shadow:0 0 15px var(--glow)}
.nav-right{display:flex;gap:10px;align-items:center}
.reqBtn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:4px;font-weight:bold;font-size:12px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 10px rgba(229,9,20,0.3)}

/* MOVIE CONTENT */
#movieSection{padding-top:70px}
#genreBar{padding:20px 5% 10px;display:flex;gap:15px;overflow-x:auto;scrollbar-width:none}
.gBtn{background:transparent;border:none;color:#666;font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;white-space:nowrap;transition:0.3s}
.gBtn:hover{color:#fff}

#featured{position:relative;height:45vh;display:flex;align-items:center;padding:0 8%;overflow:hidden;z-index:10;margin-bottom:20px;touch-action:pan-y}
#featBg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 0.6s;z-index:-1}
#featBg::after{content:'';position:absolute;inset:0;background:linear-gradient(to right, var(--bg), transparent 80%), linear-gradient(to top, var(--bg), transparent)}
#featTitle{font-family:'Bebas Neue';font-size:clamp(30px,6vw,75px);margin-bottom:15px;text-transform:uppercase}
.watchBtn{background:#fff;border:none;padding:12px 35px;font-weight:700;cursor:pointer;border-radius:4px;color:#000}

#mainContent{padding:0 5% 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px}
.card{cursor:pointer;transition:0.3s;opacity:0;animation:popIn 0.6s forwards}
@keyframes popIn { from{transform:scale(0.95);opacity:0} to{transform:scale(1);opacity:1} }
.card-img-wrap{width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;border:1px solid #111}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card-title{font-size:11px;font-weight:700;color:#999;text-align:center;padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* CLEAN VIDEO PLAYER (NO OUTLINE) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.98);z-index:9999;display:none;align-items:center;justify-content:center}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#movieFrame{width:100%; height:100%; max-width:1200px; max-height:80vh; aspect-ratio:16/9; border:none; display:block; background:#000; transform: scale(0.9)}

.closeX{position:absolute;top:20px;right:20px;z-index:10001;background:rgba(255,255,255,0.1);color:#fff;width:40px;height:40px;border:none;border-radius:50%;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}

@media (max-width: 600px) {
  #featured{height:30vh}
  #movieFrame{transform: scale(1); max-height: 70vh;}
  .closeX{top:15px; right:15px; width:35px; height:35px; font-size:20px}
}

/* REQUEST FORM OVERLAY */
.reqStage{width:90vw; max-width:500px; height:80vh; background:#000; border-radius:12px; overflow:hidden}
</style>
</head>
<body>

<nav>
  <div class="logo">TA<span>FLIX</span></div>
  <div class="nav-right">
    <button class="reqBtn" onclick="toggleOverlay('reqOverlay', true)">Request</button>
  </div>
</nav>

<div id="movieSection">
    <div id="genreBar"></div>
    <div id="featured" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event)">
      <div id="featBg"></div>
      <div id="featContent">
        <h1 id="featTitle">Loading...</h1>
        <button class="watchBtn" onclick="pFeat()">WATCH NOW</button>
      </div>
    </div>
    <div id="mainContent"></div>
</div>

<div id="playerOverlay" class="overlay">
  <div class="stage">
    <button class="closeX" onclick="toggleOverlay('playerOverlay', false)">&times;</button>
    <iframe id="movieFrame" allow="autoplay; fullscreen"></iframe>
  </div>
</div>

<div id="reqOverlay" class="overlay">
  <div class="reqStage">
    <button class="closeX" style="background:var(--accent)" onclick="toggleOverlay('reqOverlay', false)">&times;</button>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf7YYs2uVewjNqVj-E0HkYYoRNv6q90nrRc3xD2pgD6GY2JkQ/viewform?embedded=true" style="width:100%;height:100%;border:none"></iframe>
  </div>
</div>

<script>
let movies = [], fX = 0, fTimer, xDown = null; 
const JSON_URL = 'https://raw.githubusercontent.com/TafoHubOffical/TafoHub-DONTDMCA-Movies2222/refs/heads/main/Movies.json?v=' + Date.now();

async function init() {
  try {
    const res = await fetch(JSON_URL);
    movies = await res.json();
    bG(); render(); uF();
    startTimer();
  } catch (e) { console.error("Database offline."); }
}

function startTimer() { fTimer = setInterval(uF, 6000); }

function uF(reverse = false){
  if(!movies.length) return;
  const b = document.getElementById('featBg');
  if(reverse) fX = (fX - 2 + movies.length) % movies.length;
  const m = movies[fX];
  const i = m.thumbUrl || `https://drive.google.com/thumbnail?id=${m.thumbId}&sz=w1000`;
  b.style.opacity = '0';
  setTimeout(() => {
    b.style.backgroundImage = `url('${i}')`;
    b.style.opacity = '1';
    document.getElementById('featTitle').textContent = m.title;
  }, 300);
  fX = (fX + 1) % movies.length;
}

function handleTouchStart(evt) { xDown = evt.touches[0].clientX; }
function handleTouchEnd(evt) {
    if (!xDown) return;
    let xUp = evt.changedTouches[0].clientX;
    if (Math.abs(xDown - xUp) > 50) {
        clearInterval(fTimer);
        uF(xDown - xUp < 0);
        startTimer();
    }
    xDown = null;
}

function pFeat(){ if(movies.length) oM(movies[fX === 0 ? movies.length - 1 : fX - 1].fileId); }

function bG(){
  const g=["All",...new Set(movies.map(m=>m.genre))];
  document.getElementById('genreBar').innerHTML=g.map(x=>`<button class="gBtn" onclick="render('${x}')">${x}</button>`).join('');
}

function render(filter = "All"){
  const filtered = movies.filter(m => (filter === "All" || m.genre === filter));
  document.getElementById('mainContent').innerHTML = filtered.map((m, index) => {
    const i = m.thumbUrl || `https://drive.google.com/thumbnail?id=${m.thumbId}&sz=w400`;
    return `<div class="card" onclick="oM('${m.fileId}')" style="animation-delay: ${index * 0.04}s"><div class="card-img-wrap"><img src="${i}"></div><div class="card-title">${m.title}</div></div>`;
  }).join('');
}

function oM(id){
  document.getElementById('movieFrame').src = `https://drive.google.com/file/d/${id}/preview`;
  toggleOverlay('playerOverlay', true);
  clearInterval(fTimer);
}

function toggleOverlay(id, show) {
  const el = document.getElementById(id);
  el.style.display = show ? 'flex' : 'none';
  document.body.style.overflow = show ? 'hidden' : 'auto';
  if(!show && id === 'playerOverlay') {
    document.getElementById('movieFrame').src = "";
    startTimer();
  }
}

init();
</script>
</body>
</html>
